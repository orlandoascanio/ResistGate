<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusGate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-shell">
    <main class="popup-card container">
      <header class="header">
        <h1>FocusGate</h1>
        <p class="subtitle">Quickly block or unblock distracting sites.</p>
      </header>

      <section class="section">
        <label for="new-blocked-site">Domain</label>
        <div class="input-row">
          <input id="new-blocked-site" type="text" placeholder="e.g., youtube.com" />
          <button id="add-site-btn" class="btn btn-primary">Add to blocklist</button>
        </div>
      </section>

      <section class="section blocked-sites-section">
        <div class="section-head">
          <h2>Blocked now</h2>
          <a href="#" id="open-options-btn" class="manage-link">Manage all</a>
        </div>
        <ul id="blocked-sites-list"></ul>
        <p class="empty-state" id="empty-blocklist-msg">No blocked sites yet.</p>
      </section>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
