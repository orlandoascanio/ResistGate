name: CI-CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with coverage gate
        run: npm run test:coverage

  release:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Use tag name for tagged releases
            VERSION="${{ github.ref_name }}"
          else
            # Generate version from date and short SHA for main branch
            VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create extension zip
        run: |
          set -euo pipefail

          ZIP_NAME="resistgate-extension-${{ steps.version.outputs.version }}.zip"
          EXTENSION_PATHS=(
            manifest.json
            background.js
            popup
            options
            friction-page
            intention-page
            commitment-page
            welcome
            shared
            vendor
            icons
          )

          zip -r "$ZIP_NAME" "${EXTENSION_PATHS[@]}" \
            -x "._*" \
               "*/._*" \
               ".DS_Store" \
               "*/.DS_Store" \
               "CleanShot*.png" \
               "*/CleanShot*.png"

          BAD_ENTRIES="$(zipinfo -1 "$ZIP_NAME" | grep -E '(^|/)\._|(^|/)\.DS_Store$|(^|/)CleanShot.*\.png$' || true)"
          if [[ -n "$BAD_ENTRIES" ]]; then
            printf 'Release zip contains local metadata or screenshots:\n%s\n' "$BAD_ENTRIES" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resistgate-extension-${{ steps.version.outputs.version }}
          path: resistgate-extension-${{ steps.version.outputs.version }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "ResistGate ${{ steps.version.outputs.version }}"
          files: resistgate-extension-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          make_latest: true
