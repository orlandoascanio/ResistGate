<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResistGate - Access Challenge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Intentional Access Required</h1>
      <p class="message">
        This site is blocked to prevent autopilot browsing.
        If you really need this visit, prove it.
      </p>
      <p class="site-info">Blocked site: <span id="blocked-site">Loading...</span></p>
    </header>

    <div class="content">
      <div class="challenge-selection">
        <div id="pro-precheck" class="pro-precheck hidden"></div>
        <p id="precheck-error" class="error-text precheck-error"></p>

        <div class="primary-actions">
          <button id="start-unlock-challenge" class="unlock-btn">Start Challenge</button>
          <button id="manual-override-btn" class="btn btn-secondary">Manual Override</button>
        </div>

        <p id="manual-override-hint" class="helper-text"></p>
      </div>

      <div class="alternative-actions">
        <a href="https://www.google.com" class="btn btn-tertiary">Search instead</a>
        <button id="close-tab-btn" class="btn btn-secondary">Close Tab</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
