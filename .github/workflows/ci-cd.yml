name: CI-CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with coverage gate
        run: npm run test:coverage

  release:
    name: Package & Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create extension zip
        run: |
          zip -r "resistgate-extension-${{ github.ref_name }}.zip" . \
            -x "node_modules/*" \
               "tests/*" \
               ".git/*" \
               ".github/*" \
               "*.DS_Store"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resistgate-extension-${{ github.ref_name }}
          path: resistgate-extension-${{ github.ref_name }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: resistgate-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
