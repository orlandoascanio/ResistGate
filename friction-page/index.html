<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusGate - Typing Challenge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Typing Challenge</h1>
      <p class="message">To access this site, you must complete this typing challenge with full accuracy.</p>
      <p class="site-info">Blocked site: <span id="blocked-site">Loading...</span></p>
    </header>

    <div class="content">
      <div class="challenge-selection">
        <button id="start-unlock-challenge" class="unlock-btn">Start Challenge</button>
      </div>

      <div class="alternative-actions">
        <a href="https://www.google.com" class="btn btn-secondary">Go to Google</a>
        <button id="close-tab-btn" class="btn btn-secondary">Close Tab</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
