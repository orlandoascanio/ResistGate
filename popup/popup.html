<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResistGate</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="../vendor/sentry.min.js"></script>
  <script src="../vendor/sentry-init.js"></script>
  <script>Sentry.setTag('page', 'popup');</script>
</head>
<body>
  <div class="popup-shell">
    <main class="popup-card container">
      <header class="header">
        <h1>ResistGate</h1>
        <p class="subtitle">Block distractions. Unlock intentionally.</p>
      </header>

      <section class="section">
        <label for="new-blocked-site">Domain</label>
        <div class="input-row">
          <input id="new-blocked-site" type="text" placeholder="e.g., youtube.com" aria-describedby="new-site-hint" />
          <button id="add-site-btn" class="btn btn-primary">Block this site</button>
        </div>
        <p class="helper-text" id="new-site-hint">Enter a domain like youtube.com (no https://)</p>
      </section>

      <section class="section blocked-sites-section">
        <div class="section-head">
          <h2>Currently Blocked</h2>
          <a href="#" id="open-options-btn" class="manage-link">Manage all</a>
        </div>
        <p id="blocked-count-badge" class="blocked-count-meta"></p>
        <ul id="blocked-sites-list"></ul>
        <p class="empty-state" id="empty-blocklist-msg">Add a domain above to start blocking.</p>
      </section>
    </main>
  </div>
  <p id="status-announcement" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></p>
  <script src="popup.js"></script>
</body>
</html>
