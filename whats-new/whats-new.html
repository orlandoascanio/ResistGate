<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's New — ResistGate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="whats-new.css">
</head>
<body>
  <div class="wn-container">
    <div class="wn-card">

      <!-- Header -->
      <div class="wn-header">
        <div class="wn-title-row">
          <h1>What's New</h1>
          <span id="version-badge" class="version-badge"></span>
        </div>
        <p class="wn-tagline">You've got more control. Here's what you can do now.</p>
      </div>

      <!-- Changelog entries — dynamically populated by whats-new.js -->
      <div id="changelog-body" class="changelog-body" role="list" aria-label="Release changes"></div>

      <!-- Actions -->
      <div class="wn-actions">
        <button id="open-options-btn" class="btn btn-primary">Open Settings</button>
        <button id="close-btn" class="btn btn-secondary">Close</button>
      </div>

      <!-- Footer -->
      <p class="footer-note">Thanks for building discipline. 💪</p>

    </div>
  </div>

  <script src="whats-new.js"></script>
</body>
</html>
