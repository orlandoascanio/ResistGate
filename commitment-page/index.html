<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResistGate — Commitment Mode</title>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="../vendor/sentry.min.js"></script>
  <script src="../vendor/sentry-init.js"></script>
</head>
<body>
  <div class="container">

    <div class="lock-icon" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor" opacity="0.15"/>
        <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M8 11V7a4 4 0 1 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
      </svg>
    </div>

    <h1 class="title">Commitment Mode Active</h1>

    <p class="site-label">
      You blocked <strong id="blocked-site">this site</strong>.
    </p>

    <p class="tagline">
      Lock yourself out completely for a set time.<br>
      No override, no challenge&nbsp;— just pure focus.
    </p>

    <div class="countdown-card">
      <p class="countdown-label">Access unlocks in</p>
      <p id="countdown-display" class="countdown-value">--:--:--</p>
      <p id="expiry-note" class="expiry-note"></p>
    </div>

    <p id="status-message" class="status-message hidden"></p>

    <div class="actions">
      <button id="close-tab-btn" class="btn btn-secondary">Close Tab</button>
    </div>

  </div>

  <p id="status-announcement" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></p>
  <script src="script.js"></script>
</body>
</html>
