<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's New in ResistGate</title>
  <link rel="stylesheet" href="whats-new.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="../vendor/sentry.min.js"></script>
  <script src="../vendor/sentry-init.js"></script>
  <script>Sentry.setTag('page', 'whats-new');</script>
</head>
<body>
  <div class="wn-container">
    <div class="wn-card">

      <div class="wn-header">
        <div class="wn-title-row">
          <h1>What's New</h1>
          <span id="version-badge" class="version-badge" aria-label="Current version"></span>
        </div>
        <p class="wn-tagline">Here's everything that changed in this update.</p>
      </div>

      <div id="changelog-body" class="changelog-body" role="list" aria-live="polite">
        <!-- Entries injected by whats-new.js -->
      </div>

      <div class="wn-actions">
        <button id="open-options-btn" class="btn btn-primary">Open Settings</button>
        <button id="close-btn" class="btn btn-secondary">Close</button>
      </div>

      <p class="footer-note">Thanks for keeping ResistGate up to date. 🙌</p>

    </div>
  </div>

  <script src="whats-new.js"></script>
</body>
</html>
